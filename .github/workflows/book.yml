# Builds the NUDO Technical Book and publishes it to GitHub Pages.
#
# The book is explanatory, not normative: `spec/` defines the language and the
# book explains it. Publishing it does not change that, and the site says so on
# its own front page.
#
# The source is `book/src/`, the site is generated on every push that touches it,
# and the generated output is never committed. The official logos are copied into
# the book at build time rather than committed twice.

name: Book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "assets/logo/**"
      - ".github/workflows/book.yml"
  pull_request:
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: "0.5.4"
      - name: Validate the book source
        run: python3 book/scripts/check_book.py
      - name: Report the state of every translation
        run: python3 book/scripts/check_translations.py
      - name: Use the official brand assets
        run: python3 book/scripts/sync_brand_assets.py --repo-root .
      - name: Build every language into one site
        run: python3 book/scripts/build_site.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/output/site

  deploy:
    name: deploy
    needs: build
    # Only main is published: a pull request must be able to build the book
    # without being able to replace the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
