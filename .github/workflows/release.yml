# Release artefacts.
#
# PREPARED, NOT EXERCISED: no release has been published, because a pre-alpha
# toolchain that cannot compile a program should not be offered as a download.
#
# It runs only when a version tag is pushed, or when a maintainer starts it by
# hand. It produces binaries for every supported target, checksums and an SBOM.
# Publication happens only for a tag, and the job refuses to publish if the
# version in Cargo.toml does not match the tag.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release for the current version tag"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NUDO_CI: "1"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check the tag against the declared version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          declared="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])' 2>/dev/null || echo unknown)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the declared version $declared"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --package nudo-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          name="nudo-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/nudo" "dist/$name/" 2>/dev/null \
            || cp "target/${{ matrix.target }}/release/nudo.exe" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$name" && zip -q -r "../$name.zip" .)
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - name: Checksums
        shell: bash
        run: cd dist && sha256sum ./*.tar.gz ./*.zip > "${{ matrix.target }}-SHA256SUMS" 2>/dev/null || sha256sum ./* > "${{ matrix.target }}-SHA256SUMS"

      - name: Upload artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nudo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-SHA256SUMS
          if-no-files-found: error

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate an SBOM for the source tree
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: nudo-sbom.spdx.json
          output-file: nudo-sbom.spdx.json

  publish:
    name: publish
    needs: [build, sbom]
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*-SHA256SUMS > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/*.spdx.json
          draft: true
          generate_release_notes: true
          body: |
            NUDO is **pre-alpha**. This is a development snapshot of an
            incomplete toolchain: it lexes source files and nothing else.

            Do not use it for anything that matters. See ROADMAP.md for what
            works today and README.md for the current status.
