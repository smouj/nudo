<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="status-title status-desc">
<title id="status-title">NUDO milestone status through M5</title>
<desc id="status-desc">M0 through M3.1 are complete. M3.2 and M3.3 are in progress. M4 and M5 are planned. M5 requires accepted effect semantics and completion of earlier milestones.</desc>
<style>
  .head { font: 700 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; letter-spacing: .05em; }
  .row { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
  .sub { font: 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; opacity: .68; }
  .state { font: 600 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
  .frame { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .28; rx: 10; }
  .rule { stroke: currentColor; stroke-width: 1; opacity: .14; }
  .done { fill: var(--nudo-accent, #3F85FF); }
  .active { fill: none; stroke: var(--nudo-accent, #3F85FF); stroke-width: 2; }
  .planned { fill: currentColor; opacity: .18; }
  .doneText { fill: var(--nudo-accent, #3F85FF); }
  .muted { opacity: .62; }
</style>
<text class="head" x="28" y="30">MILESTONE STATUS · IMPLEMENTATION EVIDENCE</text>
<text class="sub" x="28" y="50">The roadmap marks a milestone complete only when its exit criteria and conformance evidence pass.</text>
<rect class="frame" x="18" y="68" width="864" height="458"/>
<text class="head" x="38" y="96">MILESTONE</text>
<text class="head" x="185" y="96">SCOPE</text>
<text class="head" x="748" y="96">STATE</text>
<line class="rule" x1="28" y1="108" x2="872" y2="108"/>
<g>
  <text class="row doneText" x="38" y="136">M0</text><text class="row" x="185" y="136">Repository foundation</text><rect class="done" x="748" y="124" width="12" height="12" rx="3"/><text class="state doneText" x="770" y="136">complete</text>
  <text class="row doneText" x="38" y="176">M1</text><text class="row" x="185" y="176">Source model and lexer</text><rect class="done" x="748" y="164" width="12" height="12" rx="3"/><text class="state doneText" x="770" y="176">complete</text>
  <text class="row doneText" x="38" y="216">M2</text><text class="row" x="185" y="216">Parser, lossless tree and AST</text><rect class="done" x="748" y="204" width="12" height="12" rx="3"/><text class="state doneText" x="770" y="216">complete</text>
  <text class="row doneText" x="38" y="256">M3.0</text><text class="row" x="185" y="256">Accepted semantic gates</text><rect class="done" x="748" y="244" width="12" height="12" rx="3"/><text class="state doneText" x="770" y="256">complete</text>
  <text class="row doneText" x="38" y="296">M3.1</text><text class="row" x="185" y="296">HIR and name resolution</text><rect class="done" x="748" y="284" width="12" height="12" rx="3"/><text class="state doneText" x="770" y="296">complete</text>
  <text class="row" x="38" y="336">M3.2</text><text class="row" x="185" y="336">Partial type checker; not wired into CLI</text><rect class="active" x="748" y="324" width="12" height="12" rx="3"/><text class="state doneText" x="770" y="336">in progress</text>
  <text class="row" x="38" y="376">M3.3</text><text class="row" x="185" y="376">Trust-type assignment; verify and provenance pending</text><rect class="active" x="748" y="364" width="12" height="12" rx="3"/><text class="state doneText" x="770" y="376">partial</text>
  <text class="row muted" x="38" y="416">M4</text><text class="row muted" x="185" y="416">First executable program and nudo run</text><rect class="planned" x="748" y="404" width="12" height="12" rx="3"/><text class="state muted" x="770" y="416">planned</text>
  <text class="row muted" x="38" y="456">M5</text><text class="row muted" x="185" y="456">Effect inference, checking and diagnostics</text><rect class="planned" x="748" y="444" width="12" height="12" rx="3"/><text class="state muted" x="770" y="456">planned</text>
</g>
<line class="rule" x1="28" y1="478" x2="872" y2="478"/>
<text class="sub" x="38" y="500">M5 follows the remaining M3 work and M4. Its effect-system contract is still a Draft proposal.</text>
<text class="sub" x="28" y="556">Accent = complete or active implementation · muted = planned · see ROADMAP.md for exit criteria.</text>
</svg>
