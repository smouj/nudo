[book]
title = "The NUDO Technical Book"
authors = ["NUDO Project"]
description = "Design, rationale, compiler architecture, trust model and agent-oriented programming in NUDO."
language = "en"
src = "src"

[build]
build-dir = "output/html"
create-missing = false
use-default-preprocessors = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
additional-css = ["theme/css/tokens.css", "theme/css/nudo-book.css"]
additional-js = ["theme/nudo-book.js"]
no-section-label = false
git-repository-url = "https://github.com/smouj/nudo"
git-repository-icon = "fab-github"

[output.html.search]
enable = true
limit-results = 24
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
